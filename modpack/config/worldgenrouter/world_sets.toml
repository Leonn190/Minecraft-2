[world_sets.base]
overworld = "minecraft:overworld"
default = "allow"
nether = "minecraft:the_nether"
end = "minecraft:the_end"
[world_sets.base.portal]
route_nether = false
exact_return = false
[world_sets.base.rules.structure]
deny_namespaces = ["ars_nouveau", "ars_elemental", "cobblemon", "ars_additions", "ars_fauna", "ars_structurize", "strato", "spore", "the_flesh_that_hates"]
apply_to = ["generation"]
